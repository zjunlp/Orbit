name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e 'import p from "./packages/orbit/package.json" with {type:"json"}; if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Release tag must match the package version");'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r examples/sdk/requirements-ci.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm pack:release
      - run: pnpm smoke:package dist/*.tgz
      - run: npm publish ./dist/*.tgz --access public --provenance --tag "$PUBLISH_TAG"
        env:
          PUBLISH_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
